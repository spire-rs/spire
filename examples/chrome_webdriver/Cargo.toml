# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "chrome_webdriver"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
publish = false
description = "Chrome WebDriver automation example for Spire web scraping framework"

[[bin]]
name = "chrome_webdriver"
path = "main.rs"

[dependencies]
# Async runtime and Spire framework
spire = { workspace = true, features = ["thirtyfour", "tracing"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

# Serialization and data types
serde = { workspace = true, features = ["derive"] }
jiff = { workspace = true, features = ["serde"] }

# Observability
tracing = { workspace = true, features = [] }
tracing-subscriber = { workspace = true, features = [] }

[lints]
workspace = true
