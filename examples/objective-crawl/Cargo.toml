# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "objective-crawl"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
publish = false
description = "Objective-based discovery with a scripted provider and no network"

[[bin]]
name = "objective-crawl"
path = "main.rs"

[dependencies]
# Async runtime and Spire framework
spire = { workspace = true, features = ["agent", "testing"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
