# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "spire-core"
description = "Core types and traits for Spire web scraping framework"
readme = "./README.md"
keywords = ["crawler", "scraper", "web", "framework"]
categories = ["asynchronous", "web-programming"]

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }

[lib]
# Only the criterion benches run with `cargo bench`, not the lib harness,
# which would reject criterion's flags
bench = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Default feature set (none for minimal dependencies)
default = []

# Fetching and obeying robots.txt, see `Crawler::with_robots`
robots = ["dep:robotxt"]
# Serializable seeds and fingerprints for snapshots, and `JsonlDataset`
serde = ["dep:serde", "dep:serde_json", "tokio/fs", "tokio/io-util", "tokio/sync"]
# `MockSite` and `Visit`, to test handlers without a network
testing = []

[dependencies]
# Async runtime
tokio = { workspace = true, features = ["rt", "time", "macros", "sync"] }
tokio-util = { workspace = true, features = [] }
futures = { workspace = true, features = [] }

# HTTP
http = { workspace = true, features = [] }
httpdate = { workspace = true, features = [] }

# Derive macros & utilities
bytes = { workspace = true, features = [] }
thiserror = { workspace = true, features = [] }

# Primitive datatypes
url = { workspace = true, features = [] }

# (De)serialization
serde = { workspace = true, optional = true, features = ["derive"] }
serde_json = { workspace = true, optional = true, features = [] }

# Politeness
robotxt = { workspace = true, optional = true, features = [] }

# Observability
tracing = { workspace = true, features = [] }

[dev-dependencies]
# Benchmarking
criterion = { workspace = true, features = [] }

# Testing
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }

[[bench]]
name = "crawler"
harness = false

[[bench]]
name = "frontier"
harness = false

[lints]
workspace = true
