# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "spire-thirtyfour"
description = "Thirtyfour-based browser automation backend for Spire web scraping framework"
readme = "./README.md"
keywords = ["crawler", "scraper", "browser", "webdriver"]
categories = ["asynchronous", "web-programming"]

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Default feature set (rustls for TLS)
default = ["rustls-tls"]

# TLS to the WebDriver server through rustls, with no system dependencies
rustls-tls = ["thirtyfour/rustls"]
# TLS to the WebDriver server through the platform's native library
native-tls = ["thirtyfour/native-tls"]

# Managed endpoints: drivers are downloaded, cached and spawned automatically
manager = ["thirtyfour/manager"]

[dependencies]
# Spire
spire-core = { workspace = true, features = [] }

# Browser automation, over WebDriver BiDi
thirtyfour = { workspace = true, features = ["bidi"] }
deadpool = { workspace = true, features = [] }

# Async runtime
tokio = { workspace = true, features = ["rt", "time", "macros"] }
futures = { workspace = true, features = [] }

# Response bodies
bytes = { workspace = true, features = [] }

# Encoding of BiDi request bodies and headers
serde_json = { workspace = true, features = [] }
base64 = { workspace = true, features = [] }

# Observability
tracing = { workspace = true, features = [] }

[dev-dependencies]
spire-core = { workspace = true, features = ["user-agents"] }
# Testing
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "io-util"] }

[lints]
workspace = true
