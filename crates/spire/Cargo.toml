# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "spire"
description = "The flexible crawler and scraper framework for Rust"
readme = "./README.md"
keywords = ["crawler", "scraper", "web", "framework"]
categories = ["asynchronous", "web-programming"]

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }

[lib]
# Only the criterion benches run with `cargo bench`, not the lib harness,
# which would reject criterion's flags
bench = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Default feature set: HTML parsing, and rustls for any enabled backend
default = ["html", "rustls-tls"]
# Every feature except `native-tls` and `testing`
full = ["user-agents", "html", "markdown", "macros", "robots", "sitemap", "serde", "json", "csv", "redb", "reqwest", "thirtyfour", "rustls-tls"]

# The `Html` and `Element` extractors and the `Select` trait
html = ["dep:scraper", "dep:url"]
# The `Markdown` extractor: a page's main content as Markdown
markdown = ["html", "dep:html-to-markdown-rs"]
# `#[derive(Select)]` for declarative extraction with CSS selectors
macros = ["html", "dep:spire-macros"]

# Fetching and obeying robots.txt, see `Crawler::with_robots`
robots = ["spire-core/robots"]
# The `Sitemap` extractor and `FollowSitemap` handler, plain or gzipped
sitemap = ["dep:sitemapo", "dep:flate2", "dep:tokio"]
# Serializable seeds for snapshots
serde = ["spire-core/serde"]
# The `JsonlDataset` output
json = ["serde", "spire-core/json"]
# The `CsvDataset` output
csv = ["serde", "spire-core/csv"]
# `MockSite` and `Visit`, to test handlers without a network
testing = ["spire-core/testing"]
# Browser user agents with matching navigation headers
user-agents = ["spire-core/user-agents"]

# Crash-safe frontier and seen set stored in redb
redb = ["dep:spire-redb"]

# HTTP backend built on reqwest
reqwest = ["dep:spire-reqwest"]
# Browser backend built on thirtyfour (WebDriver)
thirtyfour = ["dep:spire-thirtyfour"]

# TLS through rustls for the enabled backends
rustls-tls = ["spire-reqwest?/rustls-tls", "spire-thirtyfour?/rustls-tls"]
# TLS through the platform's native library for the enabled backends
native-tls = ["spire-reqwest?/native-tls", "spire-thirtyfour?/native-tls"]

[dependencies]
# Internal crates
spire-core = { workspace = true, features = [] }
spire-macros = { workspace = true, optional = true, features = [] }
spire-redb = { workspace = true, optional = true, features = [] }
spire-reqwest = { workspace = true, optional = true, features = [] }
spire-thirtyfour = { workspace = true, optional = true, features = [] }

# Async runtime
futures = { workspace = true, features = [] }

# (De)serialization
serde = { workspace = true, features = [] }
serde_json = { workspace = true, features = [] }
serde_urlencoded = { workspace = true, features = [] }

# Markup
scraper = { workspace = true, optional = true, features = [] }
url = { workspace = true, optional = true, features = [] }
html-to-markdown-rs = { workspace = true, optional = true, features = [] }
encoding_rs = { workspace = true, features = [] }

# Sitemaps, parsed off the async threads
sitemapo = { workspace = true, optional = true, features = [] }
flate2 = { workspace = true, optional = true, features = [] }
tokio = { workspace = true, optional = true, features = ["rt"] }

# Derive macros & utilities
bytes = { workspace = true, features = [] }
derive_more = { workspace = true, features = ["deref", "deref_mut"] }

# Observability
tracing = { workspace = true, features = [] }

[dev-dependencies]
# Benchmarking
criterion = { workspace = true, features = [] }

# Testing
spire-core = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "signal", "test-util"] }
flate2 = { workspace = true, features = [] }

[[bench]]
name = "routing"
harness = false

[[bench]]
name = "extract"
harness = false
required-features = ["macros"]

[[bench]]
name = "sitemap"
harness = false
required-features = ["sitemap"]

[lints]
workspace = true
