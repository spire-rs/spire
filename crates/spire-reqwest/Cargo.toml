# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "spire-reqwest"
description = "Reqwest-based HTTP client backend for Spire web scraping framework"
readme = "./README.md"
keywords = ["crawler", "scraper", "web", "reqwest"]
categories = ["asynchronous", "web-programming"]

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Default feature set: rustls, HTTP/2 and system proxies
default = ["rustls-tls", "http2", "system-proxy"]

# TLS through rustls, with no system dependencies
rustls-tls = ["reqwest/rustls"]
# TLS through the platform's native library (OpenSSL, Secure Transport, SChannel)
native-tls = ["reqwest/native-tls"]

# HTTP/2 negotiation over TLS
http2 = ["reqwest/http2"]
# Proxies from the environment and system settings
system-proxy = ["reqwest/system-proxy"]

# Transparent response decompression
gzip = ["reqwest/gzip"]
brotli = ["reqwest/brotli"]
zstd = ["reqwest/zstd"]
deflate = ["reqwest/deflate"]

# A cookie store shared by every request of the crawl, or one per identity
cookies = ["reqwest/cookies"]
# SOCKS5 proxies
socks = ["reqwest/socks"]
# DNS resolution through hickory instead of the system resolver
hickory-dns = ["reqwest/hickory-dns"]

[dependencies]
# Spire
spire-core = { workspace = true, features = [] }

# HTTP client
reqwest = { workspace = true, features = [] }
bytes = { workspace = true, features = [] }

[dev-dependencies]
# Testing
tokio = { workspace = true, features = ["rt", "macros", "net", "io-util"] }

[lints]
workspace = true
